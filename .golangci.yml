# rho-kit's own lint: the linter set of tools/golangci.yml (the block every
# product starts from) without depguard, since the kit has no module layers.
# `make lint` runs it once over every workspace module.
version: "2"
linters:
  enable:
    - funlen
    - gocognit
    - gosec
    - errorlint
  settings:
    funlen:
      lines: 60
      statements: 40
    gocognit:
      min-complexity: 20
  exclusions:
    rules:
      # A test reads its own files, starts its own binaries and makes its own
      # data; what gosec guards against there is the test itself.
      - path: _test\.go
        linters: [gosec]
      # A conversion cannot overflow when min just bounded the value from above,
      # or max(v, 0) kept a signed value from going negative before it turns
      # unsigned.
      - linters: [gosec]
        text: G115
        source: '\bu?int(8|16|32|64)?\((min\(|max\(-?[0-9() <]*, min\(|max\(min\(|max\([^(),]+, 0\)\))'
      # A library opens the path its caller configured; the caller owns it.
      - linters: [gosec]
        text: G(304|703)
      # An int64 goes into a signed or hashed encoding as its two's-complement
      # bits; the reader converts it back.
      - linters: [gosec]
        text: G115
        source: 'binary\.BigEndian\.(Append|Put)Uint64\([^,]+, uint64\('
      # A SHA-256 prefix becomes an advisory-lock id as its bits.
      - linters: [gosec]
        text: G115
        source: 'int64\(binary\.BigEndian\.Uint64\('
      # The background context's cancel is kept in cancelBg and called by Close.
      - path: ^data/cache/compute\.go$
        linters: [gosec]
        text: G118
      # The kit primitive "secret" maps to its import path, not a credential.
      - path: ^cmd/kit-doctor/rules/kit_primitive_collision\.go$
        linters: [gosec]
        text: G101
      # Jitter spreads retries and ticks over time; it guards nothing.
      - path: ^(runtime/batchworker/batchworker|data/lock/redislock/internal/redsyncutil/util)\.go$
        linters: [gosec]
        text: G404
      # Cloud KMS returns a CRC32C, a uint32, in an int64 wrapper.
      - linters: [gosec]
        text: G115
        source: 'uint32\(resp\.Get\w+Crc32C\(\)\.GetValue\(\)\)'
      # These tests check that an unclassified error comes back unchanged, the
      # same value, which errors.Is would not tell from a wrapped one.
      - path: ^crypto/envelope/\w+/errors_test\.go$
        linters: [errorlint]
        text: comparing with !=
      # The redaction walk follows the wrap chain itself, one Unwrap at a time.
      - path: ^core/redact/redact\.go$
        linters: [errorlint]
        text: type switch on error
      # A verifier error stays text behind ErrInvalidCredentials: wrapped, one
      # that wraps ErrUnauthenticated would let Chain fall through to the next
      # strategy instead of rejecting the credentials.
      - path: ^httpx/middleware/auth/strategy\.go$
        linters: [errorlint]
        text: non-wrapping format verb
      # net/http itself compares the recovered value with ErrAbortHandler by
      # identity; the recorder passes the handler's own bytes through.
      - path: ^httpx/middleware/recover/recover\.go$
        linters: [errorlint]
        text: comparing with ==
      - path: ^httpx/middleware/recover/recover\.go$
        linters: [gosec]
        text: G705
      # Session cookies are HttpOnly and Secure unless the caller opts out for
      # local HTTP; the CSRF double-submit cookie is read by the frontend, so
      # it is not HttpOnly on purpose.
      - path: ^(auth/oauth2/(client|pending|recovery)|httpx/middleware/csrf/csrf)\.go$
        linters: [gosec]
        text: G124
      # The redirect goes to the configured issuer's authorize endpoint.
      - path: ^auth/oauth2/client\.go$
        linters: [gosec]
        text: G710
      # Only base64 is marked safe: the logo's data: URI and a generated nonce.
      - path: ^(auth/oauth2/errorpage|httpx/middleware/cspnonce/cspnonce)\.go$
        linters: [gosec]
        text: G203
      # The test helpers send requests only to their own httptest server.
      - path: ^httpx/httpxtest/
        linters: [gosec]
        text: G704
      # Verification is replaced by VerifyConnection (tlsclone.PeerVerifier),
      # which checks chain and hostname and fails closed without ServerName.
      - path: ^security/netutil/tls_reload\.go$
        linters: [gosec]
        text: G402
      # The session carries its tokens on purpose and is sealed before storage.
      - path: ^auth/oauth2/redis/store\.go$
        linters: [gosec]
        text: G117
      # The developer tools read and write the repository they are pointed at;
      # the files they write are source files, readable by everyone.
      - path: ^cmd/
        linters: [gosec]
        text: G(122|301|302|306)
      # The table name is checked against a safe identifier pattern when it is
      # set; values are always bound parameters.
      - path: ^data/(cron|idempotency|saga)/pgstore/store\.go$
        linters: [gosec]
        text: G201
