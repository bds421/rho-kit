# rho-kit's own lint: the linter set of tools/golangci.yml (the block every
# product starts from) without depguard, since the kit has no module layers.
# `make lint` runs it once over every workspace module.
version: "2"
linters:
  enable:
    - funlen
    - gocognit
    - gosec
    - errorlint
  settings:
    funlen:
      lines: 60
      statements: 40
    gocognit:
      min-complexity: 20
  exclusions:
    rules:
      # A test reads its own files, starts its own binaries and makes its own
      # data; what gosec guards against there is the test itself.
      - path: _test\.go
        linters: [gosec]
      # A conversion cannot overflow when min just bounded the value from above,
      # or max(v, 0) kept a signed value from going negative before it turns
      # unsigned.
      - linters: [gosec]
        text: G115
        source: '\bu?int(8|16|32|64)?\((min\(|max\(-?[0-9() <]*, min\(|max\(min\(|max\([^(),]+, 0\)\))'
      # A library opens the path its caller configured; the caller owns it.
      - linters: [gosec]
        text: G(304|703)
      # An int64 goes into a signed or hashed encoding as its two's-complement
      # bits; the reader converts it back.
      - linters: [gosec]
        text: G115
        source: 'binary\.BigEndian\.(Append|Put)Uint64\([^,]+, uint64\('
      # Jitter spreads retries and ticks over time; it guards nothing.
      - path: ^runtime/batchworker/batchworker\.go$
        linters: [gosec]
        text: G404
      # Cloud KMS returns a CRC32C, a uint32, in an int64 wrapper.
      - linters: [gosec]
        text: G115
        source: 'uint32\(resp\.Get\w+Crc32C\(\)\.GetValue\(\)\)'
      # These tests check that an unclassified error comes back unchanged, the
      # same value, which errors.Is would not tell from a wrapped one.
      - path: ^crypto/envelope/\w+/errors_test\.go$
        linters: [errorlint]
        text: comparing with !=
      # The redaction walk follows the wrap chain itself, one Unwrap at a time.
      - path: ^core/redact/redact\.go$
        linters: [errorlint]
        text: type switch on error
      # The developer tools read and write the repository they are pointed at;
      # the files they write are source files, readable by everyone.
      - path: ^cmd/
        linters: [gosec]
        text: G(301|302|306)
      # The table name is checked against a safe identifier pattern when it is
      # set; values are always bound parameters.
      - path: ^data/(cron|idempotency|saga)/pgstore/store\.go$
        linters: [gosec]
        text: G201
